<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="ott-revision" content="fullscreen-sunset-pool-2" />
<meta name="theme-color" content="#e07040" />
<title>OTT — Over The Top Screening</title>
<style>
  :root {
    --navy: #0b1d3a;
    --teal: #0f8a9d;
    --sunset: #f07a2a;
    --sunset-soft: #f5a05a;
    --cream: #f6ead2;
    --cream-dim: rgba(246, 234, 210, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background:
      radial-gradient(ellipse 80% 50% at 70% 78%, rgba(255, 214, 150, 0.95), transparent 60%),
      linear-gradient(180deg, #241433 0%, #6a2a52 28%, #d85a62 52%, #f08a32 74%, #f6c98a 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    z-index: 1;
  }
  #c.dragging { cursor: grabbing; }
  .palm-frame {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  .palm-frame svg {
    position: absolute;
    bottom: -2px;
    height: min(26vh, 240px);
    width: auto;
    display: block;
  }
  .palm-frame .l { left: -4vw; }
  .palm-frame .r { right: -4vw; transform: scaleX(-1); }
  .palm-frame .m {
    left: 18vw;
    height: min(16vh, 150px);
    opacity: 0.92;
  }
  #fade {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    background:
      radial-gradient(ellipse at 50% 72%, rgba(255, 196, 130, 0.92), transparent 58%),
      linear-gradient(180deg, #2a1844 0%, #c45468 46%, #f08a3a 78%, #f6d0a0);
  }
  .wordmark {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    text-align: center;
    pointer-events: none;
    letter-spacing: 0.38em;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 2px 14px rgba(20, 6, 16, 0.72);
    max-width: calc(100% - 24px);
  }
  .wordmark strong {
    display: block;
    margin-top: 5px;
    letter-spacing: 0.16em;
    font-size: 13px;
    font-weight: 650;
    color: #fff6e8;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(108px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 5;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 244, 224, 0.78);
    text-shadow: 0 1px 8px rgba(20, 6, 16, 0.7);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.6s ease;
  }
  .hint.hide { opacity: 0; }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 7;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: min(960px, calc(100% - 16px));
    pointer-events: none;
  }
  .back, .loc-bar button { pointer-events: auto; touch-action: manipulation; }
  .back {
    appearance: none;
    border: 1px solid rgba(246, 234, 210, 0.45);
    background: linear-gradient(135deg, var(--sunset-soft), var(--sunset));
    color: #1a0c08;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(80, 20, 0, 0.35);
  }
  .back[hidden] { display: none !important; }
  .loc-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px 2px;
    width: 100%;
    padding: 8px 10px;
    background: rgba(11, 29, 58, 0.86);
    border: 1px solid rgba(15, 138, 157, 0.45);
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(20, 6, 16, 0.35);
  }
  .loc-bar button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--cream-dim);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .loc-bar button.active {
    color: #1a0c08;
    background: linear-gradient(135deg, var(--sunset-soft), var(--sunset));
    font-weight: 700;
  }
  .loc-bar button.home:not(.active)::after {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--sunset);
    box-shadow: 0 0 8px var(--sunset);
    vertical-align: middle;
  }
  @media (max-width: 720px) {
    .wordmark { font-size: 9px; letter-spacing: 0.28em; }
    .wordmark strong { font-size: 11px; letter-spacing: 0.12em; }
    .loc-bar { border-radius: 16px; padding: 6px 6px; }
    .loc-bar button { font-size: 9px; padding: 7px 6px; letter-spacing: 0.04em; }
    .hint { bottom: calc(128px + env(safe-area-inset-bottom)); font-size: 9px; }
    .palm-frame svg { height: min(22vh, 200px); }
  }
</style>
</head>
<body>
  <canvas id="c" aria-label="Florida pool enclosures globe"></canvas>
  <div class="palm-frame" aria-hidden="true">
    <svg class="palm l" viewBox="0 0 160 220">
      <g fill="#140c08">
        <path d="M86 220c-2-36-8-58-4-86 3-16 1-30-6-46 14 6 26 4 40-6-8 16-6 28 2 40 12-2 22-12 28-24-8 18-6 32 4 44 8 2 14-4 18-12-12 16-22 28-22 44-10 6-24 4-34-4 0 18-2 36-6 50h-20z"/>
        <ellipse cx="62" cy="78" rx="36" ry="9" transform="rotate(-28 62 78)"/>
        <ellipse cx="78" cy="70" rx="40" ry="9" transform="rotate(-6 78 70)"/>
        <ellipse cx="96" cy="74" rx="38" ry="8" transform="rotate(16 96 74)"/>
        <ellipse cx="100" cy="88" rx="34" ry="8" transform="rotate(40 100 88)"/>
        <ellipse cx="78" cy="96" rx="32" ry="8" transform="rotate(72 78 96)"/>
        <ellipse cx="54" cy="90" rx="30" ry="8" transform="rotate(-62 54 90)"/>
        <ellipse cx="46" cy="74" rx="28" ry="7" transform="rotate(-40 46 74)"/>
      </g>
    </svg>
    <svg class="palm m" viewBox="0 0 160 220">
      <g fill="#140c08">
        <path d="M86 220c-2-36-8-58-4-86 3-16 1-30-6-46 14 6 26 4 40-6-8 16-6 28 2 40 12-2 22-12 28-24-8 18-6 32 4 44 8 2 14-4 18-12-12 16-22 28-22 44-10 6-24 4-34-4 0 18-2 36-6 50h-20z"/>
        <ellipse cx="62" cy="78" rx="36" ry="9" transform="rotate(-28 62 78)"/>
        <ellipse cx="78" cy="70" rx="40" ry="9" transform="rotate(-6 78 70)"/>
        <ellipse cx="96" cy="74" rx="38" ry="8" transform="rotate(16 96 74)"/>
        <ellipse cx="100" cy="88" rx="34" ry="8" transform="rotate(40 100 88)"/>
        <ellipse cx="78" cy="96" rx="32" ry="8" transform="rotate(72 78 96)"/>
        <ellipse cx="54" cy="90" rx="30" ry="8" transform="rotate(-62 54 90)"/>
      </g>
    </svg>
    <svg class="palm r" viewBox="0 0 160 220">
      <g fill="#140c08">
        <path d="M86 220c-2-36-8-58-4-86 3-16 1-30-6-46 14 6 26 4 40-6-8 16-6 28 2 40 12-2 22-12 28-24-8 18-6 32 4 44 8 2 14-4 18-12-12 16-22 28-22 44-10 6-24 4-34-4 0 18-2 36-6 50h-20z"/>
        <ellipse cx="62" cy="78" rx="36" ry="9" transform="rotate(-28 62 78)"/>
        <ellipse cx="78" cy="70" rx="40" ry="9" transform="rotate(-6 78 70)"/>
        <ellipse cx="96" cy="74" rx="38" ry="8" transform="rotate(16 96 74)"/>
        <ellipse cx="100" cy="88" rx="34" ry="8" transform="rotate(40 100 88)"/>
        <ellipse cx="78" cy="96" rx="32" ry="8" transform="rotate(72 78 96)"/>
        <ellipse cx="54" cy="90" rx="30" ry="8" transform="rotate(-62 54 90)"/>
        <ellipse cx="46" cy="74" rx="28" ry="7" transform="rotate(-40 46 74)"/>
      </g>
    </svg>
  </div>
  <div id="fade"></div>
  <div class="wordmark">Over The Top Screening<strong>Florida Pool Enclosures</strong></div>
  <p class="hint" id="hint">Drag to explore · Tap a marker</p>
  <div class="dock">
    <button type="button" id="back" class="back" hidden>← Back to globe</button>
    <nav class="loc-bar" id="locBar" aria-label="Featured locations"></nav>
  </div>

<script type="module">
// iOS Safari fixes baked in:
// - no backdrop-filter / CSS filter over the WebGL canvas (Safari flickers)
// - size the buffer from visualViewport, not a stale 100vh layout viewport
// - cap devicePixelRatio at 2 and skip MSAA on touch devices
// - land is a texture, not thousands of Points (iOS point sprites blow up)
// - non-passive touchmove preventDefault so the page cannot scroll/zoom under the drag
// - webglcontextlost is preventDefault'd and the view is rebuilt on restore
const CDN = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
];

async function loadTHREE() {
  let last;
  for (const url of CDN) {
    try { return await import(url); }
    catch (err) { last = err; }
  }
  throw last;
}

const LOCATIONS = [
  { id: 'bradenton', name: 'Bradenton, FL', lat: 27.4989, lon: -82.5748, home: true },
  { id: 'sarasota', name: 'Sarasota, FL', lat: 27.3364, lon: -82.5307 },
  { id: 'tampa', name: 'Tampa, FL', lat: 27.9506, lon: -82.4572 },
  { id: 'stpete', name: 'St. Petersburg, FL', lat: 27.7676, lon: -82.6403 },
  { id: 'naples', name: 'Naples, FL', lat: 26.1420, lon: -81.7948 },
  { id: 'orlando', name: 'Orlando, FL', lat: 28.5383, lon: -81.3792 },
  { id: 'miami', name: 'Miami, FL', lat: 25.7617, lon: -80.1918 },
];

(async () => {
  let THREE;
  try {
    THREE = await loadTHREE();
  } catch (err) {
    console.error(err);
    window.__bootError = String(err);
    return;
  }

  const NAVY = 0x0b1d3a;
  const TEAL = 0x0f8a9d;
  const TEAL_BRIGHT = 0x1ab8c9;
  const SUNSET = 0xf07a2a;
  const GLOBE_R = 1.62;
  const isCoarse = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

  const canvas = document.getElementById('c');
  const fadeEl = document.getElementById('fade');
  const hintEl = document.getElementById('hint');
  const backBtn = document.getElementById('back');
  const locBar = document.getElementById('locBar');

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: !isCoarse,
      alpha: false,
      depth: true,
      stencil: false,
      powerPreference: isCoarse ? 'default' : 'high-performance',
      failIfMajorPerformanceCaveat: false,
      precision: 'highp',
    });
  } catch (err) {
    console.error(err);
    window.__bootError = String(err);
    return;
  }

  renderer.setClearColor(0xf08a3a, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.08, 120);
  scene.add(camera);

  scene.add(new THREE.AmbientLight(0xffd2b4, 0.62));
  scene.add(new THREE.HemisphereLight(0xffb48a, 0x3a221c, 0.72));
  const key = new THREE.DirectionalLight(0xffb060, 1.2);
  key.position.set(-3.5, 6.5, -2);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x7fd0dc, 0.38);
  fill.position.set(5, 2.5, 4);
  scene.add(fill);

  /* ---------- sunset sky, parented to the camera so it always fills the frame ---------- */
  const skyUniforms = {
    sunDir: { value: new THREE.Vector3(0.62, 0.42, -0.66).normalize() },
  };
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(40, isCoarse ? 24 : 32, isCoarse ? 16 : 24),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      depthTest: false,
      toneMapped: false,
      uniforms: skyUniforms,
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vDir;
        uniform vec3 sunDir;
        void main() {
          vec3 dir = normalize(vDir);
          float h = dir.y;
          vec3 hor = vec3(0.99, 0.52, 0.20);
          vec3 pink = vec3(0.90, 0.34, 0.40);
          vec3 mag = vec3(0.58, 0.20, 0.46);
          vec3 zen = vec3(0.14, 0.09, 0.26);
          vec3 below = vec3(0.36, 0.12, 0.10);
          vec3 col = mix(below, hor, smoothstep(-0.35, 0.02, h));
          col = mix(col, pink, smoothstep(0.0, 0.2, h));
          col = mix(col, mag, smoothstep(0.16, 0.5, h));
          col = mix(col, zen, smoothstep(0.48, 0.98, h));
          float nd = clamp(dot(dir, normalize(sunDir)), 0.0, 1.0);
          col += vec3(1.0, 0.72, 0.40) * pow(nd, 7.0) * 0.55;
          col += vec3(1.0, 0.96, 0.88) * pow(nd, 210.0);
          col = pow(clamp(col, 0.0, 1.0), vec3(0.454545));
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    })
  );
  sky.frustumCulled = false;
  sky.renderOrder = -100;
  camera.add(sky);

  function latLonToVec3(lat, lon, radius) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  function quatFacing(lat, lon) {
    const local = latLonToVec3(lat, lon, 1).normalize();
    const desired = new THREE.Vector3(0, 0.1, 1).normalize();
    return new THREE.Quaternion().setFromUnitVectors(local, desired);
  }

  /* ---------- globe ---------- */
  const globeGroup = new THREE.Group();
  globeGroup.quaternion.copy(quatFacing(27.4989, -82.5748));
  scene.add(globeGroup);

  function makeGlobeTexture() {
    const w = 1024;
    const h = 512;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    const ocean = ctx.createLinearGradient(0, 0, 0, h);
    ocean.addColorStop(0, '#08344a');
    ocean.addColorStop(0.42, '#15718f');
    ocean.addColorStop(1, '#08344a');
    ctx.fillStyle = ocean;
    ctx.fillRect(0, 0, w, h);
    function blob(lat, lon, rxDeg, ryDeg, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(
        ((lon + 180) / 360) * w,
        ((90 - lat) / 180) * h,
        (rxDeg / 360) * w,
        (ryDeg / 180) * h,
        0, 0, Math.PI * 2
      );
      ctx.fill();
    }
    const land = '#e6d3a8';
    const landDeep = '#cbb892';
    blob(54, -100, 28, 18, land);
    blob(38, -98, 16, 14, land);
    blob(45, -122, 10, 16, land);
    blob(20, -102, 8, 10, landDeep);
    blob(-15, -58, 14, 22, land);
    blob(8, -70, 8, 8, landDeep);
    blob(48, 15, 16, 12, land);
    blob(18, 18, 16, 22, land);
    blob(6, 22, 12, 16, landDeep);
    blob(-28, 24, 10, 12, land);
    blob(35, 90, 28, 16, land);
    blob(22, 78, 10, 12, landDeep);
    blob(-25, 134, 12, 10, land);
    blob(62, 90, 18, 8, landDeep);
    // Florida, facing the camera on load
    blob(28.2, -81.7, 1.15, 2.7, land);
    blob(30.4, -85.4, 2.3, 0.7, land);
    blob(25.8, -81.2, 0.7, 1.1, land);
    ctx.strokeStyle = 'rgba(186, 232, 236, 0.32)';
    ctx.lineWidth = 2;
    for (let lat = -60; lat <= 60; lat += 20) {
      const y = ((90 - lat) / 180) * h;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    for (let lon = -180; lon < 180; lon += 20) {
      const x = ((lon + 180) / 360) * w;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.anisotropy = isCoarse ? 1 : 4;
    return tex;
  }

  const globeMat = new THREE.MeshStandardMaterial({
    map: makeGlobeTexture(),
    roughness: 0.62,
    metalness: 0.12,
    emissive: 0x08384c,
    emissiveIntensity: 0.22,
  });
  globeGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(GLOBE_R, isCoarse ? 48 : 72, isCoarse ? 36 : 56),
    globeMat
  ));

  const atmosMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    toneMapped: false,
    uniforms: { glowColor: { value: new THREE.Color(TEAL_BRIGHT) } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vView = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      uniform vec3 glowColor;
      void main() {
        float fres = pow(clamp(1.0 - dot(normalize(vNormal), normalize(-vView)), 0.0, 1.0), 2.5);
        gl_FragColor = vec4(glowColor, fres * 0.8);
      }
    `,
  });
  globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R * 1.07, isCoarse ? 32 : 48, isCoarse ? 24 : 36), atmosMat));

  function makeGlowTexture(hex) {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    const col = new THREE.Color(hex);
    const r = Math.round(col.r * 255);
    const gr = Math.round(col.g * 255);
    const b = Math.round(col.b * 255);
    g.addColorStop(0, `rgba(${r},${gr},${b},1)`);
    g.addColorStop(0.22, `rgba(${r},${gr},${b},0.75)`);
    g.addColorStop(0.5, `rgba(${r},${gr},${b},0.18)`);
    g.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const glowOrange = makeGlowTexture(SUNSET);
  const glowTeal = makeGlowTexture(TEAL_BRIGHT);

  const markerHits = [];
  const markerVisuals = [];
  const OUT = new THREE.Vector3(0, 0, 1);

  // Nudge display positions so the seven Florida cities don't stack into one dot
  // when the globe is full-bleed. Focus uses the same display coordinate.
  const NUDGE = {
    bradenton: [0, 0],
    sarasota: [-1.7, -2.6],
    tampa: [3.1, 0.7],
    stpete: [1.2, -3.6],
    naples: [-4.4, 1.5],
    orlando: [4.8, 3.4],
    miami: [-2.6, 5.0],
  };
  function displayLatLon(loc) {
    const n = NUDGE[loc.id] || [0, 0];
    return { lat: loc.lat + n[0], lon: loc.lon + n[1] };
  }

  LOCATIONS.forEach((loc) => {
    const shown = displayLatLon(loc);
    const pos = latLonToVec3(shown.lat, shown.lon, GLOBE_R + 0.02);
    const group = new THREE.Group();
    group.position.copy(pos);
    group.quaternion.setFromUnitVectors(OUT, pos.clone().normalize());
    group.userData = { locId: loc.id, isHome: !!loc.home };

    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(loc.home ? 0.1 : 0.075, 10, 10),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.userData = { locId: loc.id };
    group.add(hit);
    markerHits.push(hit);

    const core = new THREE.Mesh(
      new THREE.SphereGeometry(loc.home ? 0.03 : 0.018, 14, 14),
      new THREE.MeshBasicMaterial({ color: loc.home ? SUNSET : TEAL_BRIGHT })
    );
    group.add(core);

    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: loc.home ? glowOrange : glowTeal,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      opacity: loc.home ? 0.95 : 0.72,
    }));
    const base = loc.home ? 0.36 : 0.2;
    sprite.scale.set(base, base, 1);
    sprite.renderOrder = loc.home ? 3 : 1;
    group.add(sprite);

    const ring = new THREE.Mesh(

  const globeCamPos = new THREE.Vector3();
  const targetCamPos = new THREE.Vector3();
  const targetLook = new THREE.Vector3();

        fadeEl.style.pointerEvents = 'none';

      camera.lookAt(currentLook);
      if (camera.position.distanceTo(targetCamPos) < 0.01) {
        camera.position.copy(targetCamPos);
        currentLook.copy(targetLook);
        camera.lookAt(currentLook);
        camAnimating = false;
      }
    } else {
      camera.lookAt(currentLook);
    }

    if (phase === 'globe') {
      markerVisuals.forEach((mv, i) => {
        const pulse = 1 + Math.sin(t * (mv.isHome ? 2.5 : 1.7) + i) * (mv.isHome ? 0.16 : 0.1);
        mv.sprite.scale.set(mv.base * pulse, mv.base * pulse, 1);
        mv.ring.material.opacity = 0.28 + 0.4 * (0.5 + 0.5 * Math.sin(t * 2.1 + i));
        const on = focusedId === mv.id;
        mv.core.scale.setScalar(on ? 1.45 : 1);
      });
    } else {
      shine.material.opacity = 0.34 + Math.sin(t * 1.6) * 0.08;
    }

    renderer.render(scene, camera);

    if (window.__grabResolve) {
      const tmp = document.createElement('canvas');
      tmp.width = 1;
      tmp.height = 1;
      const ctx = tmp.getContext('2d', { willReadFrequently: true });
      const sample = (sx, sy) => {
        ctx.drawImage(canvas, sx, sy, 8, 8, 0, 0, 1, 1);
        const d = ctx.getImageData(0, 0, 1, 1).data;
        return { r: d[0], g: d[1], b: d[2], a: d[3] };
      };
      const bw = canvas.width;
      const bh = canvas.height;
      const payload = {
        tl: sample(2, 2),
        tr: sample(bw - 10, 2),
        center: sample((bw / 2) - 4, (bh / 2) - 4),
        upper: sample((bw / 2) - 4, 4),
      };
      const resolve = window.__grabResolve;
      window.__grabResolve = null;
      resolve(payload);
    }

    if (!window.__ready) window.__ready = true;
  }

  animate();
})();
</script>
</body>
</html>
